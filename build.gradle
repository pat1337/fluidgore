plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu (optional integration, compile-only)
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
	// Optional compatibility testing: ./gradlew runClientGameTest -PextraMods=<folder of mod jars>
	if (project.hasProperty("extraMods")) {
		runs.configureEach {
			vmArg "-Dfabric.addMods=${project.property('extraMods')}"
		}
	}

	mods {
		"fluidgore" {
			sourceSet sourceSets.main
		}
	}
}

// Automated in-game test (./gradlew runClientGameTest). Lives in its own "gametest" source set and is never
// packaged into the mod jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "fluidgore-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Soft dependency: only the ModMenuApi entrypoint touches these classes, and Fabric
	// only loads that entrypoint when Mod Menu is installed.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
