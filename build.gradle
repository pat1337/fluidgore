plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu (optional integration, compile-only)
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

// The Cobble Tank is its own project and jar (../CobbleTank, CobbleTank-<version>.jar). The dev client, the showcase runs
// and the game test compile its sources from there (-PcobbleTankDir=<dir> to point elsewhere), so they can play it.
def cobbleTankDir = file(providers.gradleProperty("cobbleTankDir").getOrElse("../CobbleTank"))
sourceSets {
	tank {
		java.srcDirs = [new File(cobbleTankDir, "src/main/java")]
		resources.srcDirs = [new File(cobbleTankDir, "src/main/resources")]
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	// Optional compatibility testing: ./gradlew runClientGameTest -PextraMods=<folder of mod jars>
	if (project.hasProperty("extraMods")) {
		runs.configureEach {
			vmArg "-Dfabric.addMods=${project.property('extraMods')}"
		}
	}

	// Only some game tests, for quick work on one feature: ./gradlew runClientGameTest -PonlyTests=ragdoll,stairs
	if (project.hasProperty("onlyTests")) {
		runs.configureEach {
			vmArg "-Dfluidgore.only=${project.property('onlyTests')}"
		}
	}
	// ... and only some demos in the demos test: -PonlyTests=demos -PonlyDemos=sponge,arrows
	if (project.hasProperty("onlyDemos")) {
		runs.configureEach {
			vmArg "-Dfluidgore.demos=${project.property('onlyDemos')}"
		}
	}
	// ... and against a dedicated server instead of singleplayer: -PonlyTests=keptBodies,cleanupAuth -Pdedicated
	if (project.hasProperty("dedicated")) {
		runs.configureEach {
			vmArg "-Dfluidgore.dedicated=true"
		}
	}
	// ... and with a shader pack switched on (needs Iris in -PextraMods): -Pshaders=<path to the pack zip>
	if (project.hasProperty("shaders")) {
		runs.configureEach {
			vmArg "-Dfluidgore.shaders=${project.property('shaders')}"
		}
	}
	// ... and with Ragdoll Physics on: -PragdollOn
	if (project.hasProperty("ragdollOn")) {
		runs.configureEach {
			vmArg "-Dfluidgore.ragdollOn=true"
		}
	}

	// The dev client loads the Cobble Tank too (its classpath includes Fluid Gore's).
	runs.named("client") { source sourceSets.tank }

	// Two players on one server, side by side (shared dice, relayed actions):
	//   ./gradlew runShowServer    then, in two more terminals,    ./gradlew runShowOne    ./gradlew runShowTwo
	// The server is offline-mode on localhost:25566 (run-server/); each client has its own folder and joins it.
	runs {
		showServer {
			server()
			name "Showcase Server"
			runDir "run-server"
			source sourceSets.tank
		}
		showOne {
			client()
			name "Showcase Client One"
			runDir "run"
			programArgs "--username", "PlayerOne", "--quickPlayMultiplayer", "localhost:25566"
			source sourceSets.tank
		}
		showTwo {
			client()
			name "Showcase Client Two"
			runDir "run2"
			programArgs "--username", "PlayerTwo", "--quickPlayMultiplayer", "localhost:25566"
			source sourceSets.tank
		}
	}

	mods {
		"fluidgore" {

			sourceSet sourceSets.main
		}
		"cobbletank" {
			sourceSet sourceSets.tank
		}
	}
}

// Automated in-game test (./gradlew runClientGameTest). Lives in its own "gametest" source set and is never
// packaged into the mod jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "fluidgore-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// The game test plays the tank's scenes too, so it sees the Cobble Tank.
sourceSets.named("gametest") {
	compileClasspath += sourceSets.tank.output
	runtimeClasspath += sourceSets.tank.output
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Soft dependency: only the ModMenuApi entrypoint touches these classes, and Fabric
	// only loads that entrypoint when Mod Menu is installed.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Puts the built jar in the game's mods folder for testing in the real game: ./gradlew installMod (or -PmodsDir=<folder>).
// Older copies are deleted first, since two copies of the same mod crash the game. The Cobble Tank installs from its own
// project (../CobbleTank: ./gradlew installMod).
def modsDir = providers.gradleProperty("modsDir").orElse(providers.environmentVariable("APPDATA").map { it + "/.minecraft/mods" })
tasks.register("installMod") {
	group = "fluidgore"
	description = "Builds Fluid Gore and installs it in the game's mods folder, replacing older copies."
	def jarFile = tasks.named("jar").flatMap { it.archiveFile }
	inputs.file(jarFile)
	def target = modsDir
	doLast {
		def dir = new File(target.get())
		dir.mkdirs()
		dir.listFiles().findAll { it.name ==~ /(?i)fluidgore-.*.jar/ }.each {
			if (!it.delete()) throw new GradleException("Could not delete ${it.name} in ${dir}: close Minecraft first, it locks the mods it loaded")
		}
		def source = jarFile.get().asFile
		java.nio.file.Files.copy(source.toPath(), new File(dir, source.name).toPath())
		println "Installed ${source.name} in ${dir}"
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// The Cobble Tank's manifest, filled in from its own project's gradle.properties.
processTankResources {
	def props = new Properties()
	def propsFile = new File(cobbleTankDir, "gradle.properties")
	if (propsFile.isFile()) propsFile.withInputStream { props.load(it) }
	def version = props.getProperty("version", "dev")
	def fluidgoreVersion = project.version
	inputs.property "version", version
	inputs.property "fluidgoreVersion", fluidgoreVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "fluidgore_version": fluidgoreVersion
	}
}
