name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: fluidgore
          path: build/libs/fluidgore-*.jar
